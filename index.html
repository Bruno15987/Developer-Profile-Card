<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Bruninh</title>
    <link rel="icon" type="image/png" href="favicon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ===== Cores principais ===== */
        :root {
            --bg: #000000;
            --card-bg: rgba(0, 0, 0, 0.72);
            --text: #ffffff;
            --text-secondary: #bbbbbb;
            --border: rgba(255, 255, 255, 0.12);
            --accent: #79C83D;
            --muted: #777777;
            --updated: #555555;
            --icon-bg: rgba(255, 255, 255, 0.08);
            --icon-hover: rgba(255, 255, 255, 0.18);
            --tooltip-bg: rgba(20, 20, 20, 0.95);
        }

        /* Tema claro */
        body.light {
            --bg: #f0f0f0;
            --card-bg: rgba(255, 255, 255, 0.78);
            --text: #111111;
            --text-secondary: #555555;
            --border: rgba(0, 0, 0, 0.12);
            --accent: #4a9c2d;
            --muted: #666666;
            --updated: #888888;
            --icon-bg: rgba(0, 0, 0, 0.06);
            --icon-hover: rgba(0, 0, 0, 0.12);
            --tooltip-bg: rgba(40, 40, 40, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            cursor: none; /* esconde o cursor padrão */
        }

        body {
            background-color: var(--bg);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.6s ease;
        }

        /* Cursor personalizado */
        .cursor {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background 0.15s;
            mix-blend-mode: difference;
        }

        .cursor.hover {
            width: 28px;
            height: 28px;
            background: rgba(121, 200, 61, 0.45);
        }

        /* Vinheta no fundo */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.6s ease;
        }

        body.light::after {
            opacity: 0.3;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        body.light #matrix,
        body.light #stars {
            opacity: 0.25;
        }

        /* Card principal */
        .card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 22px 22px;
            border-radius: 18px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            color: var(--text);
            transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.6s ease, border-color 0.6s ease, color 0.6s ease;
            opacity: 0;
            transform: translateY(30px) scale(0.92);
            filter: blur(8px);
            animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.15s;
            overflow: hidden;
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* Textura de grain */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            border-radius: 18px;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.95);
        }

        /* Avatar */
        .avatar-wrapper {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 16px auto;
            transition: transform 0.3s ease;
        }

        .avatar-wrapper:hover {
            transform: scale(1.07);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(121, 200, 61, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .avatar-wrapper:hover .avatar {
            box-shadow: 0 0 0 5px rgba(121, 200, 61, 0.35);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bolinha de status online */
        .status {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background: #79C83D;
            border-radius: 50%;
            border: 2.5px solid #111;
            box-shadow: 0 0 8px rgba(121, 200, 61, 0.6);
        }

        body.light .status {
            border-color: #eee;
        }

        /* Nome com efeito glitch */
        h1 {
            font-size: 1.35rem;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: -0.3px;
            min-height: 1.4em;
            cursor: pointer;
            display: inline-block;
            transition: color 0.6s ease;
        }

        h1:hover {
            animation: glitch 0.35s linear;
        }

        @keyframes glitch {
            0%   { transform: translate(0); text-shadow: none; }
            20%  { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff0040, -2px 0 #00ffff; }
            40%  { transform: translate(2px, -1px); text-shadow: -2px 0 #ff0040, 2px 0 #00ffff; }
            60%  { transform: translate(-1px, 2px); text-shadow: 1px 0 #ff0040, -1px 0 #00ffff; }
            80%  { transform: translate(1px, -2px); text-shadow: -1px 0 #ff0040, 1px 0 #00ffff; }
            100% { transform: translate(0); text-shadow: none; }
        }

        .greeting {
            font-size: 0.78rem;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .time {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        p.quote {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 16px;
            line-height: 1.45;
            min-height: 2.8em;
        }

        .badge {
            display: inline-block;
            border: 1px solid var(--border);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 20px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Ícones sociais */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .social-icons a {
            color: var(--text);
            text-decoration: none;
            background: var(--icon-bg);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.25s ease;
            font-size: 1rem;
            position: relative;
        }

        .social-icons a:hover {
            background: var(--icon-hover);
            transform: translateY(-3px) scale(1.08);
        }

        /* Tooltip dos ícones */
        .social-icons a::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: var(--tooltip-bg);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .social-icons a:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .views {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #count {
            color: var(--accent);
            font-weight: 600;
        }

        .updated {
            font-size: 0.68rem;
            color: var(--updated);
        }

        /* Botões de música e tema */
        .music-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }

        .music-btn,
        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--icon-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.85rem;
        }

        .music-btn:hover,
        .theme-btn:hover {
            background: var(--icon-hover);
            color: var(--text);
        }

        .music-btn.playing {
            color: var(--accent);
            border-color: rgba(121, 200, 61, 0.3);
        }

        .volume-slider {
            width: 0;
            opacity: 0;
            transition: all 0.3s ease;
            accent-color: var(--accent);
            height: 4px;
            cursor: pointer;
        }

        .volume-slider.show {
            width: 70px;
            opacity: 1;
        }

        .theme-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Cursor personalizado -->
    <div class="cursor" id="cursor"></div>

    <!-- Fundos animados -->
    <canvas id="matrix"></canvas>
    <canvas id="stars"></canvas>

    <!-- Card do perfil -->
    <div class="card">

        <!-- Botão de tema -->
        <button class="theme-btn" id="themeBtn" title="Alternar tema">
            <i class="fa-solid fa-moon"></i>
        </button>

        <!-- Controles de música -->
        <div class="music-controls">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.6">
            <button class="music-btn" id="volumeBtn" title="Volume">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="music-btn" id="musicBtn" title="Música">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>

        <!-- Avatar -->
        <div class="avatar-wrapper">
            <div class="avatar">
                <img src="favicon.jpeg" alt="Foto de perfil">
            </div>
            <div class="status"></div>
        </div>

        <div class="greeting" id="greeting">Bom dia</div>
        <h1 id="name"></h1>
        <div class="time" id="currentTime">--:--</div>

        <p class="quote" id="quote"></p>
        <div class="badge">💻 Programador</div>

        <!-- Redes sociais -->
        <div class="social-icons">
            <a href="https://github.com/Bruno15987" target="_blank" class="click-sound" data-tooltip="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://youtube.com/@bit_systems_x" target="_blank" class="click-sound" data-tooltip="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://instagram.com/bruninh.s_" target="_blank" class="click-sound" data-tooltip="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>

        <div class="views">
            👁️ Visualizações: <span id="count">...</span>
        </div>
        <div class="updated">Atualizado em 19/08/2026</div>
    </div>

    <!-- Música de fundo -->
    <audio id="bg-music" loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ====================== CURSOR ======================
        const cursor = document.getElementById('cursor');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Aumenta o cursor quando passa em cima de botões e links
        document.querySelectorAll('a, button, h1, input').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });


        // ====================== MATRIX + ESTRELAS ======================
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');

        function resize() {
            canvas.width = starsCanvas.width = window.innerWidth;
            canvas.height = starsCanvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Caracteres do Matrix (mistura de números, letras e katakana)
        const chars = '0123456789アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンabcdefghijklmnopqrstuvwxyz@#$%&*';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        // Estrelas piscando no fundo
        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 1.5 + 0.5,
            opacity: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        }));

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function drawStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            stars.forEach(star => {
                star.opacity += star.speed;
                if (star.opacity > 1 || star.opacity < 0) star.speed *= -1;

                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starsCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.opacity)})`;
                starsCtx.fill();
            });
        }

        setInterval(() => {
            drawMatrix();
            drawStars();
        }, 33);


        // ====================== SAUDAÇÃO + HORÁRIO ======================
        function updateGreetingAndTime() {
            const now = new Date();
            const hour = now.getHours();

            let greeting = 'Boa noite';
            if (hour >= 5 && hour < 12) greeting = 'Bom dia';
            else if (hour >= 12 && hour < 18) greeting = 'Boa tarde';

            document.getElementById('greeting').textContent = greeting;
            document.getElementById('currentTime').textContent =
                `${String(hour).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        updateGreetingAndTime();
        setInterval(updateGreetingAndTime, 1000);


        // ====================== EFEITO DE DIGITAÇÃO ======================
        const nameEl = document.getElementById('name');
        const quoteEl = document.getElementById('quote');

        async function typeText(element, text, speed = 80) {
            element.textContent = '';
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        }

        // Digita o nome e depois a frase
        (async () => {
            await typeText(nameEl, 'Bruninh', 100);
            await new Promise(r => setTimeout(r, 400));
            await typeText(quoteEl, '"A mente que se abre a uma nova ideia jamais voltará ao seu tamanho original."', 30);
        })();


        // ====================== CONTADOR DE VISUALIZAÇÕES ======================
        // Só conta 1 vez por dispositivo (usando localStorage)
        const counterKey = 'bruno15987-bruninh-v3';
        const storageKey = 'bruninh_visited_v3';

        async function updateCounter() {
            const el = document.getElementById('count');

            try {
                if (localStorage.getItem(storageKey)) {
                    // Já visitou → só mostra o valor atual
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/get/${counterKey}`);
                    const data = await res.json();
                    el.textContent = data.value || '1';
                } else {
                    // Primeira visita neste dispositivo → incrementa
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${counterKey}`);
                    const data = await res.json();
                    el.textContent = data.value;
                    localStorage.setItem(storageKey, 'true');
                }
            } catch {
                el.textContent = '1';
            }
        }

        updateCounter();


        // ====================== SOM DE CLIQUE ======================
        function playClick() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.07);
        }

        document.querySelectorAll('.click-sound').forEach(el => {
            el.addEventListener('click', playClick);
        });


        // ====================== MÚSICA + VOLUME ======================
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        let isPlaying = false;

        music.volume = volumeSlider.value;

        // Mostra/esconde o slider de volume (funciona no celular)
        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            volumeSlider.classList.toggle('show');
        });

        // Fecha o slider se clicar fora
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.music-controls')) {
                volumeSlider.classList.remove('show');
            }
        });

        // Ajusta o volume e muda o ícone
        volumeSlider.addEventListener('input', () => {
            music.volume = volumeSlider.value;

            if (volumeSlider.value == 0) {
                volumeBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else if (volumeSlider.value < 0.4) {
                volumeBtn.innerHTML = '<i class="fa-solid fa-volume-low"></i>';
            } else {
                volumeBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });

        // Play / Pause
        musicBtn.addEventListener('click', () => {
            playClick();

            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                musicBtn.classList.remove('playing');
            } else {
                music.play().catch(() => {}); // evita erro se o navegador bloquear
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                musicBtn.classList.add('playing');
            }

            isPlaying = !isPlaying;
        });


        // ====================== TEMA CLARO / ESCURO ======================
        const themeBtn = document.getElementById('themeBtn');

        themeBtn.addEventListener('click', () => {
            playClick();
            document.body.classList.toggle('light');

            const isLight = document.body.classList.contains('light');
            themeBtn.innerHTML = isLight
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
        });


        // ====================== EASTER EGG ======================
        // Clique 5 vezes no nome para descobrir
        let clickCount = 0;

        nameEl.addEventListener('click', () => {
            clickCount++;
            playClick();

            if (clickCount === 5) {
                console.log('%c✨ Você encontrou o easter egg do Bruninh! ✨', 'color: #79C83D; font-size: 16px; font-weight: bold;');
                alert('Você descobriu o easter egg! 👀\n\nContinue explorando...');
                clickCount = 0;
            }

            // Reseta se demorar muito entre os cliques
            setTimeout(() => {
                if (clickCount > 0 && clickCount < 5) clickCount = 0;
            }, 3000);
        });
    </script>
</body>
</html>
