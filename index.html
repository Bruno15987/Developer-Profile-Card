<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="icon" type="image/png" href="favicon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(0, 0, 0, 0.72);
            --text: #ffffff;
            --text-secondary: #bbbbbb;
            --border: rgba(255, 255, 255, 0.12);
            --accent: #79C83D;
            --muted: #777777;
            --updated: #555555;
            --icon-bg: rgba(255, 255, 255, 0.08);
            --icon-hover: rgba(255, 255, 255, 0.18);
            --tooltip-bg: rgba(20, 20, 20, 0.95);
        }
        body.light {
            --bg: #f0f0f0;
            --card-bg: rgba(255, 255, 255, 0.78);
            --text: #111111;
            --text-secondary: #555555;
            --border: rgba(0, 0, 0, 0.12);
            --accent: #4a9c2d;
            --muted: #666666;
            --updated: #888888;
            --icon-bg: rgba(0, 0, 0, 0.06);
            --icon-hover: rgba(0, 0, 0, 0.12);
            --tooltip-bg: rgba(40, 40, 40, 0.95);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            cursor: none;
        }
        body {
            background-color: var(--bg);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.6s ease;
        }
        .cursor {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background 0.15s;
            mix-blend-mode: difference;
        }
        .cursor.hover {
            width: 28px;
            height: 28px;
            background: rgba(121, 200, 61, 0.45);
        }
        /* Efeito de clique */
        .ripple {
            position: fixed;
            border-radius: 50%;
            background: rgba(121, 200, 61, 0.35);
            transform: scale(0);
            animation: ripple-animation 0.7s ease-out forwards;
            pointer-events: none;
            z-index: 9998;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
            z-index: 1;
        }
        body.light::after { opacity: 0.3; }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        body.light #matrix,
        body.light #stars { opacity: 0.25; }
        .card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 22px 22px;
            border-radius: 18px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            color: var(--text);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            opacity: 0;
            transform: translateY(30px) scale(0.92);
            filter: blur(8px);
            animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.15s;
            overflow: hidden;
        }
        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.95);
        }
        .avatar-wrapper {
            position: relative;
            width: 84px; height: 84px;
            margin: 0 auto 16px auto;
            transition: transform 0.3s ease;
        }
        .avatar-wrapper:hover { transform: scale(1.07); }
        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(121, 200, 61, 0.15);
        }
        .avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .status {
            position: absolute;
            bottom: 4px; right: 4px;
            width: 14px; height: 14px;
            background: #79C83D;
            border-radius: 50%;
            border: 2.5px solid #111;
            box-shadow: 0 0 8px rgba(121, 200, 61, 0.6);
        }
        body.light .status { border-color: #eee; }
        h1 {
            font-size: 1.35rem;
            margin-bottom: 4px;
            font-weight: 600;
            min-height: 1.4em;
            display: inline-block;
        }
        .greeting {
            font-size: 0.78rem;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .time {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 12px;
        }
        p.quote {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 16px;
            line-height: 1.45;
            min-height: 2.8em;
        }
        .badge {
            display: inline-block;
            border: 1px solid var(--border);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 16px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .social-icons a {
            color: var(--text);
            text-decoration: none;
            background: var(--icon-bg);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.25s ease;
            font-size: 1.05rem;
            position: relative;
        }
        .social-icons a:hover {
            background: var(--icon-hover);
            transform: translateY(-3px) scale(1.08);
        }
        .social-icons a img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .social-icons a::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: var(--tooltip-bg);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }
        .social-icons a:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        /* ===== VISITOR BADGES - Estilo bonito ===== */
        .badges-wrapper {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 0;
        }
        .badges-wrapper.show {
            max-height: 80px;
            opacity: 1;
            margin-bottom: 14px;
            margin-top: 6px;
        }
        .badges-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 4px;
            background: rgba(121, 200, 61, 0.06);
            border: 1px solid rgba(121, 200, 61, 0.15);
            border-radius: 12px;
        }
        .badges-container a {
            display: inline-block;
            transition: transform 0.25s ease, filter 0.25s ease;
            opacity: 0;
            transform: translateY(8px);
        }
        .badges-wrapper.show .badges-container a {
            opacity: 1;
            transform: translateY(0);
        }
        .badges-wrapper.show .badges-container a:nth-child(1) { transition-delay: 0.08s; }
        .badges-wrapper.show .badges-container a:nth-child(2) { transition-delay: 0.16s; }
        .badges-wrapper.show .badges-container a:nth-child(3) { transition-delay: 0.24s; }
        .badges-wrapper.show .badges-container a:nth-child(4) { transition-delay: 0.32s; }
        .badges-container a:hover {
            transform: scale(1.08);
            filter: brightness(1.15);
        }
        .badges-container img {
            height: 22px;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        .views {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .views svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        #count { color: var(--accent); font-weight: 600; }
        .updated { font-size: 0.68rem; color: var(--updated); }
        .music-btn, .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--icon-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            position: absolute;
            z-index: 5;
        }
        .music-btn:hover, .theme-btn:hover {
            background: var(--icon-hover);
            color: var(--text);
        }
        .music-btn.playing {
            color: var(--accent);
            border-color: rgba(121, 200, 61, 0.3);
        }
        .music-btn {
            top: 12px;
            right: 12px;
        }
        .theme-btn {
            top: 12px;
            left: 12px;
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <canvas id="matrix"></canvas>
    <canvas id="stars"></canvas>
    <div class="card">
        <button class="theme-btn" id="themeBtn" title="Alternar tema">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="music-btn" id="musicBtn" title="Música">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="avatar-wrapper">
            <div class="avatar">
                <img id="avatarImg" src="" alt="Foto de perfil">
            </div>
            <div class="status"></div>
        </div>
        <div class="greeting" id="greeting">Bom dia</div>
        <h1 id="name"></h1>
        <div class="time" id="currentTime">--:--</div>
        <p class="quote" id="quote"></p>
        <div class="badge" id="badge"></div>
        <div class="social-icons" id="socialIcons"></div>
        <!-- Visitor Badges (aparecem ao clicar nas redes) -->
        <div class="badges-wrapper" id="badgesWrapper">
            <div class="badges-container" id="badgesContainer"></div>
        </div>
        <div class="views">
            <!-- SVG no lugar do emoji 👁️ -->
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            Visualizações: <span id="count">...</span>
        </div>
        <div class="updated" id="updated"></div>
    </div>
    <audio id="bg-music" loop preload="auto">
        <source id="musicSource" src="" type="audio/mpeg">
    </audio>
    <script src="config.js"></script>
    <script>
        // ====================== APLICAR CONFIGURAÇÃO ======================
        if (typeof CONFIG === 'undefined') {
            alert('Erro: O arquivo config.js não foi encontrado!');
        }
        document.title = `Perfil | ${CONFIG.nome}`;
        document.querySelector('link[rel="icon"]').href = CONFIG.favicon;
        document.getElementById('avatarImg').src = CONFIG.fotoPerfil;
        document.getElementById('badge').textContent = CONFIG.badge;
        document.getElementById('updated').textContent = CONFIG.dataAtualizacao;
        document.getElementById('musicSource').src = CONFIG.musica;
        // Redes sociais
        const socialContainer = document.getElementById('socialIcons');
        const badgesWrapper = document.getElementById('badgesWrapper');
        let badgesShown = false;
        CONFIG.redes.forEach(rede => {
            const a = document.createElement('a');
            a.href = rede.link;
            a.target = '_blank';
            a.className = 'click-sound';
            a.setAttribute('data-tooltip', rede.nome);
            if (rede.imagem) {
                a.innerHTML = `<img src="${rede.imagem}" alt="${rede.nome}">`;
            } else {
                a.innerHTML = `<i class="${rede.icone}"></i>`;
            }
            // Ao clicar em qualquer rede → mostra os badges
            a.addEventListener('click', (e) => {
                // Só mostra os badges se existirem no config
                if (CONFIG.badges && CONFIG.badges.length > 0 && !badgesShown) {
                    badgesWrapper.classList.add('show');
                    badgesShown = true;
                }
            });
            socialContainer.appendChild(a);
        });
        // Cria os badges
        const badgesContainer = document.getElementById('badgesContainer');
        if (CONFIG.badges && CONFIG.badges.length > 0) {
            CONFIG.badges.forEach(badge => {
                const a = document.createElement('a');
                a.href = badge.link || '#';
                a.target = '_blank';
                a.innerHTML = `<img src="${badge.imagem}" alt="badge">`;
                badgesContainer.appendChild(a);
            });
        }
        // ====================== CURSOR ======================
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.querySelectorAll('a, button, h1').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });
        // ====================== EFEITO DE CLIQUE ======================
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        });
        // ====================== MATRIX + ESTRELAS ======================
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');
        function resize() {
            canvas.width = starsCanvas.width = window.innerWidth;
            canvas.height = starsCanvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        const chars = '0123456789アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンabcdefghijklmnopqrstuvwxyz@#$%&*';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);
        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 1.5 + 0.5,
            opacity: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        }));
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        function drawStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            stars.forEach(star => {
                star.opacity += star.speed;
                if (star.opacity > 1 || star.opacity < 0) star.speed *= -1;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starsCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.opacity)})`;
                starsCtx.fill();
            });
        }
        setInterval(() => {
            drawMatrix();
            drawStars();
        }, 33);
        // ====================== SAUDAÇÃO + HORÁRIO ======================
        function updateGreetingAndTime() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = 'Boa noite';
            if (hour >= 5 && hour < 12) greeting = 'Bom dia';
            else if (hour >= 12 && hour < 18) greeting = 'Boa tarde';
            document.getElementById('greeting').textContent = greeting;
            document.getElementById('currentTime').textContent =
                `${String(hour).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        updateGreetingAndTime();
        setInterval(updateGreetingAndTime, 1000);
        // ====================== EFEITO DE DIGITAÇÃO ======================
        const nameEl = document.getElementById('name');
        const quoteEl = document.getElementById('quote');
        async function typeText(element, text, speed = 80) {
            element.textContent = '';
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        }
        (async () => {
            await typeText(nameEl, CONFIG.nome, 100);
            await new Promise(r => setTimeout(r, 400));
            await typeText(quoteEl, CONFIG.frase, 30);
        })();
        // ====================== CONTADOR ======================
        async function updateCounter() {
            const el = document.getElementById('count');
            try {
                if (localStorage.getItem(CONFIG.contadorStorage)) {
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/get/${CONFIG.contadorChave}`);
                    const data = await res.json();
                    el.textContent = data.value || '1';
                } else {
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${CONFIG.contadorChave}`);
                    const data = await res.json();
                    el.textContent = data.value;
                    localStorage.setItem(CONFIG.contadorStorage, 'true');
                }
            } catch {
                el.textContent = '1';
            }
        }
        updateCounter();
        // ====================== SOM DE CLIQUE ======================
        function playClick() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch (e) {}
        }
        document.querySelectorAll('.click-sound').forEach(el => {
            el.addEventListener('click', playClick);
        });
        // ====================== MÚSICA ======================
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;
        music.volume = 0.6;
        music.load();
        function tryAutoplay() {
            music.play().then(() => {
                isPlaying = true;
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                musicBtn.classList.add('playing');
            }).catch(() => {});
        }
        window.addEventListener('load', () => {
            setTimeout(tryAutoplay, 800);
        });
        document.body.addEventListener('click', function firstClick() {
            if (!isPlaying) tryAutoplay();
            document.body.removeEventListener('click', firstClick);
        }, { once: true });
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                musicBtn.classList.remove('playing');
            } else {
                music.play().then(() => {
                    musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    musicBtn.classList.add('playing');
                }).catch(() => {
                    alert('Não foi possível tocar a música.\nVerifique se o arquivo existe.');
                });
            }
            isPlaying = !isPlaying;
        });
        // ====================== TEMA ======================
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            playClick();
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            themeBtn.innerHTML = isLight
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
        });
    </script>
</body>
</html>
